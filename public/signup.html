<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organisation Signup</title>
  <link rel="stylesheet" href="/assets/style.css" />
  <style>
    .signup-body { min-height:100vh;background:#f1f5f9;display:flex;align-items:center;justify-content:center;padding:24px; }
    .signup-card { width:100%;max-width:760px;background:#fff;border-radius:14px;box-shadow:0 10px 40px rgba(15,23,42,.12);padding:28px; }
    .signup-head { margin-bottom:22px; }
    .signup-head h1 { font-size:24px;color:#0f172a;margin-bottom:6px; }
    .signup-head p { color:#64748b;font-size:14px;line-height:1.5; }
    .grid { display:grid;grid-template-columns:1fr 1fr;gap:16px; }
    .full { grid-column:1 / -1; }
    textarea { width:100%;min-height:82px;padding:12px 16px;border:1.5px solid #e2e8f0;border-radius:10px;font:inherit;background:#f8fafc;resize:vertical; }
    textarea:focus { outline:none;border-color:#2563eb;background:#fff; }
    .actions { display:flex;gap:12px;align-items:center;margin-top:18px; }
    .secondary { color:#64748b;text-decoration:none;font-size:14px; }
    #msg { margin-top:16px;display:none; }
    @media (max-width:720px) { .grid { grid-template-columns:1fr; } .signup-card { padding:22px; } }
  </style>
</head>
<body class="signup-body">
  <main class="signup-card">
    <div class="signup-head">
      <h1>Office / Organisation Signup</h1>
      <p>Submit office details for approval. Access starts only after super admin verification and credential sharing.</p>
    </div>

    <form id="signupForm">
      <div class="grid">
        <div class="form-group full">
          <label>Organisation / Office Name *</label>
          <input id="organization_name" required placeholder="Example: Geebharat Office" />
        </div>
        <div class="form-group">
          <label>Contact Person *</label>
          <input id="contact_person" required placeholder="Director or owner name" />
        </div>
        <div class="form-group">
          <label>Mobile *</label>
          <input id="contact_mobile" required placeholder="10 digit mobile" />
        </div>
        <div class="form-group">
          <label>Email *</label>
          <input id="contact_email" type="email" required placeholder="office@example.com" />
        </div>
        <div class="form-group">
          <label>City</label>
          <input id="city" placeholder="City" />
        </div>
        <div class="form-group">
          <label>State</label>
          <input id="state" placeholder="State" />
        </div>
        <div class="form-group full">
          <label>Address</label>
          <textarea id="address" placeholder="Office address"></textarea>
        </div>
        <div class="form-group full">
          <label>Notes</label>
          <textarea id="notes" placeholder="Any additional information"></textarea>
        </div>
      </div>
      <div class="actions">
        <button class="btn-primary" id="submitBtn" type="submit">Submit Signup Request</button>
        <a class="secondary" href="/">Back to portal</a>
      </div>
      <div id="msg" class="alert"></div>
    </form>
  </main>

  <script src="/assets/address-autocomplete.js"></script>
  <script>
    function value(id) { return document.getElementById(id).value.trim(); }
    function showMsg(text, ok) {
      const msg = document.getElementById('msg');
      msg.textContent = text;
      msg.className = 'alert ' + (ok ? 'alert-success' : 'alert-error');
      msg.style.display = 'block';
    }
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Submitting...';
      try {
        const res = await fetch('/api/organizations/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            organization_name: value('organization_name'),
            contact_person: value('contact_person'),
            contact_mobile: value('contact_mobile'),
            contact_email: value('contact_email'),
            city: value('city'),
            state: value('state'),
            address: value('address'),
            notes: value('notes')
          })
        });
        const data = await res.json();
        showMsg(data.message || (data.success ? 'Signup submitted' : 'Signup failed'), !!data.success);
        if (data.success) document.getElementById('signupForm').reset();
      } catch {
        showMsg('Network error. Please try again.', false);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Submit Signup Request';
      }
    });
  </script>
</body>
</html>
