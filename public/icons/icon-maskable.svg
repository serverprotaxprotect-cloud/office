<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full bleed background for maskable icon (safe zone = center 80%) -->
  <rect width="512" height="512" fill="#1e3a8a"/>
  <!-- Clock circle -->
  <circle cx="256" cy="230" r="105" fill="none" stroke="#ffffff" stroke-width="20"/>
  <!-- Clock hands -->
  <line x1="256" y1="230" x2="256" y2="158" stroke="#ffffff" stroke-width="17" stroke-linecap="round"/>
  <line x1="256" y1="230" x2="315" y2="265" stroke="#60a5fa" stroke-width="13" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="256" cy="230" r="11" fill="#60a5fa"/>
  <!-- Bottom bar -->
  <rect x="155" y="370" width="202" height="26" rx="13" fill="#60a5fa"/>
</svg>
