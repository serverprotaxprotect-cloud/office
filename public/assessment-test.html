<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Candidate Assessment | Gee Bharat</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#eef2f7;color:#1e293b;line-height:1.5;padding:16px}
    .wrap{max-width:760px;margin:0 auto}
    .brand{text-align:center;padding:18px 0 10px}
    .brand h1{font-size:22px;color:#1e3a8a;font-weight:800;letter-spacing:.3px}
    .brand small{color:#64748b;font-size:12px;font-weight:600}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;box-shadow:0 4px 18px rgba(15,23,42,.06);padding:22px;margin-top:14px}
    h2{font-size:18px;color:#0f172a;margin-bottom:6px}
    .muted{color:#64748b;font-size:13px}
    label{display:block;font-size:12px;font-weight:700;color:#475569;margin:12px 0 4px}
    input,select{width:100%;padding:11px 12px;border:1.5px solid #e2e8f0;border-radius:9px;font-size:14px;outline:none;background:#f8fafc}
    input:focus,select:focus{border-color:#2563eb;background:#fff}
    .btn{display:inline-block;width:100%;padding:13px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:15px;font-weight:800;cursor:pointer;margin-top:16px}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .btn-back{background:#e2e8f0;color:#334155;width:auto;padding:9px 16px;font-size:13px;margin-top:0}
    .q-card{border:1px solid #e8edf3;border-radius:11px;padding:15px;margin-bottom:12px;background:#fcfdff}
    .q-num{font-size:11px;font-weight:800;color:#2563eb;text-transform:uppercase;letter-spacing:.5px}
    .q-text{font-size:15px;font-weight:600;margin:5px 0 10px;white-space:pre-wrap}
    .opt{display:flex;align-items:flex-start;gap:10px;border:1.5px solid #e2e8f0;border-radius:9px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:#fff;transition:.15s}
    .opt:hover{border-color:#93c5fd;background:#f0f7ff}
    .opt.sel{border-color:#2563eb;background:#eff6ff}
    .opt input{width:auto;margin-top:3px}
    .opt-key{font-weight:800;color:#475569;min-width:18px}
    .bar{position:sticky;top:0;z-index:5;background:#fff;border:1px solid #e2e8f0;border-radius:11px;padding:11px 15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
    .timer{font-weight:800;color:#b45309;font-size:15px}
    .hidden{display:none}
    .err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:8px;padding:10px 12px;font-size:13px;font-weight:600;margin-top:12px}
    .ok-screen{text-align:center;padding:30px 16px}
    .ok-screen .big{font-size:52px;margin-bottom:10px}
    .prog{font-size:12px;color:#64748b;font-weight:700}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <h1>Gee Bharat</h1>
      <small>Candidate Assessment</small>
    </div>

    <div id="loading" class="card"><p class="muted">Loading assessment...</p></div>

    <!-- Registration -->
    <div id="regCard" class="card hidden">
      <h2 id="testTitle">Assessment</h2>
      <p class="muted" id="testDesc"></p>
      <div id="testMeta" class="muted" style="margin-top:8px;font-weight:600"></div>
      <label>Full Name *</label>
      <input id="c_name" placeholder="Your full name" autocomplete="name"/>
      <label>Mobile Number *</label>
      <input id="c_mobile" placeholder="10-digit mobile number" inputmode="numeric" autocomplete="tel"/>
      <label>Email (optional)</label>
      <input id="c_email" placeholder="you@example.com" autocomplete="email"/>
      <label>Position Applied For</label>
      <input id="c_position" placeholder="e.g. Accountant, GST Executive"/>
      <div id="regErr" class="err hidden"></div>
      <button class="btn" id="startBtn" onclick="startTest()">Start Assessment &rarr;</button>
    </div>

    <!-- Test -->
    <div id="testCard" class="hidden">
      <div class="bar">
        <span class="prog" id="progLbl">Question 0 of 0</span>
        <span class="timer hidden" id="timer"></span>
      </div>
      <div id="questions"></div>
      <div id="testErr" class="err hidden"></div>
      <button class="btn" id="submitBtn" onclick="submitTest()">Submit Assessment</button>
    </div>

    <!-- Done -->
    <div id="doneCard" class="card hidden">
      <div class="ok-screen">
        <div class="big">&#9989;</div>
        <h2>Thank you!</h2>
        <p class="muted" id="doneMsg" style="margin-top:8px"></p>
      </div>
    </div>
  </div>

  <script>
    const token = new URLSearchParams(location.search).get('t') || '';
    let TEST = null, QUESTIONS = [], startedAt = null, timerInt = null;
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    async function init() {
      if (!token) { $('loading').innerHTML = '<p class="err">Invalid assessment link.</p>'; return; }
      try {
        const res = await fetch('/api/assessment/public/' + encodeURIComponent(token));
        const data = await res.json();
        if (!data.success) { $('loading').innerHTML = `<p class="err">${esc(data.message || 'Assessment not available.')}</p>`; return; }
        TEST = data.test; QUESTIONS = data.questions;
        $('testTitle').textContent = TEST.title;
        $('testDesc').textContent = TEST.description || '';
        const parts = [`${TEST.total_questions} question${TEST.total_questions > 1 ? 's' : ''}`];
        if (TEST.duration_minutes > 0) parts.push(`${TEST.duration_minutes} minute time limit`);
        $('testMeta').textContent = parts.join('  •  ');
        $('loading').classList.add('hidden');
        $('regCard').classList.remove('hidden');
      } catch {
        $('loading').innerHTML = '<p class="err">Could not load the assessment. Please check your connection.</p>';
      }
    }

    function startTest() {
      const name = $('c_name').value.trim();
      const mobile = $('c_mobile').value.trim();
      const err = $('regErr');
      if (!name) { err.textContent = 'Please enter your name.'; err.classList.remove('hidden'); return; }
      if (!/^\d{10}$/.test(mobile.replace(/\D/g, '').slice(-10)) || mobile.replace(/\D/g,'').length < 10) {
        err.textContent = 'Please enter a valid 10-digit mobile number.'; err.classList.remove('hidden'); return;
      }
      err.classList.add('hidden');
      startedAt = new Date().toISOString();
      renderQuestions();
      $('regCard').classList.add('hidden');
      $('testCard').classList.remove('hidden');
      if (TEST.duration_minutes > 0) startTimer(TEST.duration_minutes * 60);
      window.scrollTo(0, 0);
    }

    function renderQuestions() {
      $('progLbl').textContent = `Question 1 of ${QUESTIONS.length}`;
      $('questions').innerHTML = QUESTIONS.map((q, i) => {
        const opts = [['A', q.option_a], ['B', q.option_b], ['C', q.option_c], ['D', q.option_d]]
          .filter(o => o[1] !== '' && o[1] != null)
          .map(([k, v]) => `
            <label class="opt" onclick="pick(${q.id},'${k}',this)">
              <input type="radio" name="q_${q.id}" value="${k}"/>
              <span class="opt-key">${k}.</span><span>${esc(v)}</span>
            </label>`).join('');
        return `<div class="q-card" data-qid="${q.id}">
          <div class="q-num">Question ${i + 1}</div>
          <div class="q-text">${esc(q.question_text)}</div>
          ${opts}
        </div>`;
      }).join('');
    }

    const answers = {};
    function pick(qid, key, el) {
      answers[qid] = key;
      el.parentNode.querySelectorAll('.opt').forEach(o => o.classList.remove('sel'));
      el.classList.add('sel');
      el.querySelector('input').checked = true;
      const done = Object.keys(answers).length;
      $('progLbl').textContent = `${done} of ${QUESTIONS.length} answered`;
    }

    function startTimer(seconds) {
      const t = $('timer');
      t.classList.remove('hidden');
      let left = seconds;
      const tick = () => {
        const m = Math.floor(left / 60), s = left % 60;
        t.textContent = `⏱ ${m}:${String(s).padStart(2, '0')}`;
        if (left <= 0) { clearInterval(timerInt); submitTest(true); return; }
        left -= 1;
      };
      tick();
      timerInt = setInterval(tick, 1000);
    }

    let submitting = false;
    async function submitTest(auto = false) {
      if (submitting) return;
      const unanswered = QUESTIONS.length - Object.keys(answers).length;
      if (!auto && unanswered > 0) {
        if (!confirm(`You have ${unanswered} unanswered question(s). Submit anyway?`)) return;
      }
      submitting = true;
      if (timerInt) clearInterval(timerInt);
      $('submitBtn').disabled = true;
      $('submitBtn').textContent = 'Submitting...';
      try {
        const res = await fetch('/api/assessment/public/' + encodeURIComponent(token) + '/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            candidate_name: $('c_name').value.trim(),
            mobile: $('c_mobile').value.trim(),
            email: $('c_email').value.trim(),
            position: $('c_position').value.trim(),
            answers,
            started_at: startedAt,
          }),
        });
        const data = await res.json();
        if (!data.success) {
          $('testErr').textContent = data.message || 'Could not submit. Please try again.';
          $('testErr').classList.remove('hidden');
          submitting = false;
          $('submitBtn').disabled = false;
          $('submitBtn').textContent = 'Submit Assessment';
          return;
        }
        $('testCard').classList.add('hidden');
        $('doneMsg').textContent = data.message;
        $('doneCard').classList.remove('hidden');
        window.scrollTo(0, 0);
      } catch {
        $('testErr').textContent = 'Network error. Please try again.';
        $('testErr').classList.remove('hidden');
        submitting = false;
        $('submitBtn').disabled = false;
        $('submitBtn').textContent = 'Submit Assessment';
      }
    }

    init();
  </script>
</body>
</html>
