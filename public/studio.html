<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gee Bharat Studio</title>
<link rel="icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<script src="/assets/auth-session.js"></script>
<style>
  :root {
    --bg:#0d0e12; --bg2:#12141a; --panel:#171a22; --panel2:#1d212b; --line:#2a2f3c; --ink:#eceef4; --muted:#8c93a7;
    --accent:#ffb020; --accent-ink:#1a1204; --brand:#7c5cff; --rec:#ff4d4f; --ok:#34d399; --bad:#ff5d5d; --warn:#fbbf24;
    --paper:#f6f1e4; --paper-ink:#22201a; --shadow:0 10px 30px rgba(0,0,0,.35);
    --display:'Oswald','Arial Narrow',Impact,sans-serif; --ui:'Inter',system-ui,'Segoe UI',Arial,sans-serif; --mono:'Courier Prime','Courier New',monospace;
  }
  :root[data-theme="light"] {
    --bg:#efece4; --bg2:#f6f3ec; --panel:#ffffff; --panel2:#f7f4ee; --line:#ddd7c8; --ink:#1b1d24; --muted:#6c7080;
    --accent:#d97706; --accent-ink:#fff; --brand:#5b3df5; --shadow:0 8px 24px rgba(60,50,20,.12);
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body { font-family:var(--ui); background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  button { font-family:inherit; }

  header { display:flex; align-items:center; gap:14px; padding:10px 18px; background:linear-gradient(180deg,#14151b,#0d0e12); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:30; }
  :root[data-theme="light"] header { background:linear-gradient(180deg,#26233a,#1b1a2b); }
  .logo { display:flex; align-items:center; gap:10px; }
  .clap { width:34px; height:30px; position:relative; }
  .clap i { position:absolute; left:0; right:0; height:11px; background:repeating-linear-gradient(115deg,#fff 0 7px,#14151b 7px 14px); border-radius:3px; }
  .clap i:first-child { top:0; transform:rotate(-8deg); transform-origin:left bottom; }
  .clap b { position:absolute; left:0; right:0; bottom:0; height:19px; background:#2b2f3c; border:2px solid #fff; border-radius:3px; }
  .brand { font-family:var(--display); font-size:22px; letter-spacing:2px; text-transform:uppercase; color:#fff; line-height:1; }
  .brand small { display:block; font-family:var(--ui); font-size:10.5px; letter-spacing:.4px; text-transform:none; color:#9aa1b5; margin-top:3px; }
  .rec { display:flex; align-items:center; gap:7px; font-family:var(--display); letter-spacing:2px; font-size:13px; color:#ff8d8d; margin-left:6px; }
  .rec::before { content:''; width:10px; height:10px; border-radius:50%; background:var(--rec); box-shadow:0 0 12px var(--rec); animation:blink 1.6s infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  .hspace { flex:1; }
  .chip-user { color:#d7dbe8; font-size:13px; font-weight:600; background:rgba(255,255,255,.07); padding:7px 12px; border-radius:999px; }
  header .hb { background:rgba(255,255,255,.09); color:#fff; border:0; border-radius:8px; padding:8px 12px; font-size:13px; font-weight:600; cursor:pointer; text-decoration:none; }
  header .hb:hover { background:rgba(255,255,255,.18); }

  .shell { display:flex; min-height:calc(100vh - 56px); }
  #side { width:218px; flex-shrink:0; background:var(--bg2); border-right:1px solid var(--line); padding:16px 10px; display:none; }
  #side .sec { color:var(--muted); font-size:10.5px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; padding:4px 12px 10px; }
  #side button { display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:transparent; color:var(--ink); border:0; border-radius:10px; padding:11px 12px; font-size:14px; font-weight:600; cursor:pointer; margin-bottom:3px; }
  #side button:hover { background:var(--panel2); }
  #side button.on { background:linear-gradient(90deg,var(--accent),#ff8a1f); color:var(--accent-ink); }
  #side .ic { width:20px; text-align:center; font-size:16px; }
  #side .badge { margin-left:auto; background:var(--rec); color:#fff; font-size:11px; font-weight:800; border-radius:10px; padding:1px 7px; }
  main { flex:1; min-width:0; padding:20px 22px 70px; }
  h2.page { font-family:var(--display); font-weight:600; letter-spacing:1.2px; text-transform:uppercase; font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:16px; }

  .strip { display:grid; grid-template-columns:repeat(6,minmax(120px,1fr)); gap:10px; margin-bottom:18px; }
  .stage { --c:#8c93a7; position:relative; text-align:left; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:12px; padding:20px 14px 12px; cursor:pointer; overflow:hidden; transition:transform .12s, border-color .12s, box-shadow .12s; }
  .stage::before, .stage::after { content:''; position:absolute; left:0; right:0; height:7px; background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 13px); opacity:.9; }
  .stage::before { top:0; } .stage::after { bottom:0; }
  .stage:hover { transform:translateY(-2px); border-color:var(--c); }
  .stage.on { border-color:var(--c); box-shadow:0 0 0 2px var(--c) inset, var(--shadow); background:linear-gradient(180deg,color-mix(in srgb,var(--c) 18%,var(--panel)),var(--panel)); }
  .stage .n { display:block; font-family:var(--display); font-size:34px; font-weight:600; line-height:1; color:var(--c); }
  .stage .l { display:block; font-size:12px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; margin-top:5px; }

  .work { display:grid; grid-template-columns:minmax(300px,380px) 1fr; gap:16px; align-items:start; }
  .listcol { display:flex; flex-direction:column; gap:10px; }
  .tcard { background:var(--panel); border:1px solid var(--line); border-left:5px solid var(--c,#8c93a7); border-radius:12px; padding:12px 14px; cursor:pointer; transition:.12s; }
  .tcard:hover { background:var(--panel2); }
  .tcard.sel { outline:2px solid var(--accent); background:var(--panel2); }
  .tcard b { display:block; font-size:15px; margin-bottom:6px; line-height:1.3; }
  .meta { color:var(--muted); font-size:12.5px; margin-top:6px; line-height:1.5; }
  .chip { display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--panel2); color:var(--ink); border:1px solid var(--line); margin:2px 5px 0 0; }
  .chip.st { background:var(--c); color:#fff; border-color:transparent; }
  .chip.fmt { background:rgba(124,92,255,.18); border-color:rgba(124,92,255,.5); }
  .chip.rv-p { background:rgba(251,191,36,.18); border-color:rgba(251,191,36,.6); color:var(--warn); }
  .chip.rv-a { background:rgba(52,211,153,.15); border-color:rgba(52,211,153,.5); color:var(--ok); }
  .chip.rv-c { background:rgba(255,93,93,.15); border-color:rgba(255,93,93,.5); color:var(--bad); }
  .detail { background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); overflow:hidden; }
  .detail .dh { padding:18px 20px 14px; border-bottom:1px solid var(--line); background:linear-gradient(135deg,var(--panel2),var(--panel)); }
  .detail h3 { font-family:var(--display); font-weight:600; letter-spacing:.6px; font-size:26px; margin:6px 0 4px; line-height:1.15; }
  .pipe { display:flex; gap:6px; margin:12px 0 4px; }
  .pipe i { flex:1; height:6px; border-radius:4px; background:var(--line); }
  .pipe i.d { background:var(--c); }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; align-items:center; }
  .actions label { margin:0; }
  .dbody { padding:16px 20px 22px; }
  .facts { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
  .fact { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:9px 12px; }
  .fact span { display:block; font-size:10.5px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--muted); }
  .fact b { font-size:14px; }
  .sect { font-family:var(--display); letter-spacing:1.5px; text-transform:uppercase; font-size:13px; color:var(--accent); margin:20px 0 8px; display:flex; align-items:center; gap:8px; }
  .sect::after { content:''; flex:1; height:1px; background:var(--line); }
  .hook { font-size:18px; font-weight:600; line-height:1.5; border-left:4px solid var(--accent); padding:4px 0 4px 14px; }
  .scriptpaper { background:var(--paper); color:var(--paper-ink); font-family:var(--mono); font-size:16px; line-height:1.75; border-radius:10px; padding:18px 22px; white-space:pre-wrap; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08); }
  .kp { list-style:none; margin:0; padding:0; }
  .kp li { display:flex; gap:10px; padding:7px 0; border-bottom:1px dashed var(--line); font-size:14.5px; }
  .kp li::before { content:'\2713'; color:var(--ok); font-weight:800; }
  .empty { text-align:center; color:var(--muted); padding:60px 20px; }
  .empty .big { font-size:46px; margin-bottom:8px; }
  .meter { display:flex; align-items:center; gap:10px; margin:8px 0 0; font-size:13px; font-weight:600; flex-wrap:wrap; }
  .meter .bar { flex:1; min-width:120px; height:8px; background:var(--line); border-radius:6px; overflow:hidden; }
  .meter .bar i { display:block; height:100%; background:var(--ok); }
  .meter.over .bar i { background:var(--bad); } .meter.near .bar i { background:var(--warn); }
  .banner { border-radius:12px; padding:12px 14px; margin:0 0 14px; font-size:14px; border:1px solid var(--line); }
  .banner.p { background:rgba(251,191,36,.12); border-color:rgba(251,191,36,.5); }
  .banner.a { background:rgba(52,211,153,.12); border-color:rgba(52,211,153,.45); }
  .banner.c { background:rgba(255,93,93,.12); border-color:rgba(255,93,93,.45); }
  .cl { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:6px 14px; }
  .cl label.ck { display:flex; align-items:center; gap:9px; margin:0; padding:7px 10px; background:var(--panel2); border:1px solid var(--line); border-radius:9px; font-size:13.5px; font-weight:500; letter-spacing:0; text-transform:none; color:var(--ink); cursor:pointer; }
  .cl label.ck input { width:auto; accent-color:var(--accent); }
  .cl label.ck.done { border-color:rgba(52,211,153,.5); }
  .thread { display:flex; flex-direction:column; gap:8px; }
  .th { border-radius:10px; padding:9px 12px; font-size:13.5px; background:var(--panel2); border:1px solid var(--line); }
  .th small { color:var(--muted); display:block; margin-bottom:2px; font-weight:600; }
  .th.log { background:transparent; border:0; border-left:3px solid var(--line); border-radius:0; color:var(--muted); font-size:12.5px; padding:2px 10px; }
  .copyrow { display:flex; gap:8px; align-items:flex-start; }
  .copyrow > div { flex:1; }
  .box { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; white-space:pre-wrap; word-break:break-word; }
  .child { display:flex; align-items:center; gap:10px; padding:8px 10px; background:var(--panel2); border:1px solid var(--line); border-radius:9px; margin-bottom:6px; cursor:pointer; }

  .btn { background:var(--accent); color:var(--accent-ink); border:0; border-radius:9px; padding:10px 16px; font-weight:700; font-size:13.5px; cursor:pointer; }
  .btn:hover { filter:brightness(1.08); }
  .btn.alt { background:transparent; color:var(--ink); border:1.5px solid var(--line); }
  .btn.alt:hover { border-color:var(--accent); color:var(--accent); }
  .btn.bad { background:var(--bad); color:#fff; } .btn.ok { background:var(--ok); color:#06241a; } .btn.vio { background:var(--brand); color:#fff; }
  .btn.sm { padding:6px 11px; font-size:12px; }
  label { display:block; font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; margin:12px 0 5px; }
  input, select, textarea { width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:9px; font:inherit; font-size:14px; background:var(--bg2); color:var(--ink); }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); }
  textarea { resize:vertical; min-height:90px; }
  textarea.mono { font-family:var(--mono); font-size:15px; line-height:1.6; }
  .statusSel { width:auto; padding:8px 10px; font-weight:700; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .muted { color:var(--muted); font-size:12.5px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.8px; }
  .msg { padding:10px 12px; border-radius:9px; font-size:13px; margin:10px 0; }
  .msg.err { background:rgba(255,93,93,.12); color:#ff9a9a; border:1px solid rgba(255,93,93,.35); }
  .msg.ok { background:rgba(52,211,153,.12); color:#5eead4; border:1px solid rgba(52,211,153,.35); }
  :root[data-theme="light"] .msg.err { color:#b91c1c; } :root[data-theme="light"] .msg.ok { color:#047857; }
  .center { max-width:430px; margin:56px auto; }
  .guide { background:var(--panel2); border:1px dashed var(--line); border-radius:12px; padding:12px 14px; font-size:13px; margin-bottom:14px; line-height:1.55; }
  details.more { border:1px solid var(--line); border-radius:10px; padding:2px 12px 10px; margin-top:12px; }
  details.more summary { cursor:pointer; font-weight:700; padding:10px 0; font-size:13.5px; }

  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .cal .dow { text-align:center; font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:1px; padding:4px 0; }
  .cal .day { min-height:96px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:6px; overflow:hidden; }
  .cal .day.today { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .cal .day.out { opacity:.4; }
  .cal .day .d { font-size:12px; font-weight:700; color:var(--muted); margin-bottom:4px; }
  .cal .ev { display:block; width:100%; text-align:left; font-size:11.5px; font-weight:600; padding:3px 6px; border-radius:6px; margin-bottom:3px; border:0; color:#fff; background:var(--c); cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .backdrop { position:fixed; inset:0; background:rgba(0,0,0,.7); backdrop-filter:blur(3px); display:none; align-items:flex-start; justify-content:center; padding:20px 14px; overflow:auto; z-index:60; }
  .backdrop.open { display:flex; }
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px 22px; width:min(860px,100%); margin:auto; box-shadow:var(--shadow); }
  .modal h2 { font-family:var(--display); letter-spacing:1px; text-transform:uppercase; font-size:22px; margin:0; flex:1; }
  .fmtpick { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .fmtpick label.opt { margin:0; padding:10px; border:1.5px solid var(--line); border-radius:10px; cursor:pointer; text-transform:none; letter-spacing:0; font-size:13px; color:var(--ink); font-weight:600; }
  .fmtpick label.opt small { display:block; color:var(--muted); font-weight:500; margin-top:3px; font-size:11.5px; }
  .fmtpick input { width:auto; margin-right:6px; accent-color:var(--accent); }
  .fmtpick label.opt.sel { border-color:var(--accent); background:var(--panel2); }

  #tp { position:fixed; inset:0; background:#000; color:#fff; z-index:100; display:none; flex-direction:column; }
  #tp.open { display:flex; }
  #tpBar { display:flex; gap:8px; align-items:center; padding:10px 12px; background:#101218; flex-wrap:wrap; border-bottom:1px solid #222; }
  #tpBar button { background:#2a2f3c; color:#fff; border:0; border-radius:8px; padding:9px 13px; font-size:14px; font-weight:700; cursor:pointer; }
  #tpBar button.go { background:var(--ok); color:#06241a; }
  #tpBar span { font-size:13px; opacity:.85; }
  #tpScroll { flex:1; overflow-y:scroll; padding:40vh 7vw 80vh; scrollbar-width:none; }
  #tpScroll::-webkit-scrollbar { display:none; }
  #tpText { font-family:var(--ui); font-weight:700; line-height:1.5; white-space:pre-wrap; text-align:center; }
  #tpText.mirror { transform:scaleX(-1); }
  .tp-h { color:var(--accent); font-family:var(--display); font-size:.55em; letter-spacing:3px; text-transform:uppercase; display:block; margin:1.4em 0 .3em; }
  #tpLine { position:absolute; left:0; right:0; top:40%; height:2px; background:rgba(255,176,32,.55); pointer-events:none; box-shadow:0 0 12px rgba(255,176,32,.6); z-index:101; }
  #tpCount { position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-family:var(--display); font-size:34vw; color:var(--accent); background:rgba(0,0,0,.75); z-index:102; }

  @media (max-width:980px) { .strip { grid-template-columns:repeat(3,1fr); } .work { grid-template-columns:1fr; } }
  @media (max-width:760px) {
    .shell { flex-direction:column; }
    #side { width:100%; padding:8px; overflow-x:auto; white-space:nowrap; border-right:0; border-bottom:1px solid var(--line); }
    #side.show { display:flex !important; gap:6px; } #side .sec { display:none; }
    #side button { width:auto; margin:0; padding:9px 12px; }
    main { padding:14px 12px 60px; } .grid2 { grid-template-columns:1fr; } .rec { display:none; } .chip-user { display:none; }
    .fmtpick { grid-template-columns:1fr; } .cal .day { min-height:70px; padding:3px; } .cal .ev { font-size:10px; padding:2px 4px; }
  }
</style>
</head>
<body>
<header>
  <div class="logo"><div class="clap"><i></i><b></b></div>
    <div class="brand">Gee Bharat Studio<small>Plan it. Script it. Shoot it.</small></div></div>
  <div class="rec">ON AIR</div>
  <div class="hspace"></div>
  <span class="chip-user" id="whoChip" style="display:none"></span>
  <button class="hb" id="themeBtn" onclick="toggleTheme()" title="Switch light / dark">&#9728;</button>
  <a class="hb" href="/" id="backLink" style="display:none">&larr; Back</a>
  <button class="hb" id="logoutBtn" style="display:none" onclick="logout()">Sign out</button>
</header>
<div class="shell"><nav id="side"></nav><main id="app"></main></div>

<div class="backdrop" id="topicModal"><div class="modal" id="topicBody"></div></div>
<div class="backdrop" id="pwModal"><div class="modal" style="max-width:430px">
  <h2>Choose a new password</h2>
  <p class="muted">For your security, please replace the temporary password you were given.</p>
  <label>New password (at least 8 characters)</label><input type="password" id="newPw" autocomplete="new-password">
  <div id="pwMsg"></div>
  <div class="row" style="margin-top:14px"><button class="btn" onclick="savePassword()">Save password</button></div>
</div></div>

<div id="tp">
  <div id="tpBar">
    <button onclick="tpClose()">&times; Close</button>
    <button class="go" id="tpPlay" onclick="tpToggle()">&#9654; Start</button>
    <button onclick="tpSpeed(-1)">Slower</button><span id="tpSpeedLbl"></span><button onclick="tpSpeed(1)">Faster</button>
    <button onclick="tpSize(-6)">A-</button><button onclick="tpSize(6)">A+</button>
    <button onclick="tpMirror()">Mirror</button>
    <button onclick="tpStep(-1)">&larr; Prev</button><button onclick="tpStep(1)">Next &rarr;</button>
    <span id="tpTitle"></span>
  </div>
  <div id="tpLine"></div><div id="tpCount"></div>
  <div id="tpScroll"><div id="tpText"></div></div>
</div>

<script>
const STATUSES = ['Idea','Script Ready','Ready to Shoot','Shot','Editing','Published'];
const STAGE_COLOR = { 'Idea':'#8c93a7', 'Script Ready':'#4c9aff', 'Ready to Shoot':'#ffb020', 'Shot':'#ff4d4f', 'Editing':'#a970ff', 'Published':'#34d399', 'Archived':'#6b7280' };
const STAGE_HINT = { 'Idea':'Rough topics', 'Script Ready':'Script written', 'Ready to Shoot':'Waiting for camera', 'Shot':'Recorded', 'Editing':'In edit', 'Published':'Live' };
const FORMATS = {
  Shorts: { label:'Shorts / Reels', desc:'Instagram Reels, YouTube Shorts, Facebook Reels', target:60 },
  Long:   { label:'Long video', desc:'YouTube long format', target:300 },
  Both:   { label:'Long + Shorts', desc:'A long video that shorts are cut from', target:420 },
};
const CATEGORIES = ['GST','Income Tax','ROC / MCA','Audit','Accounting','Startup','Labour Law','General'];
const FACT_ITEMS = [['section','Section / rule number is correct'],['source','Notification or circular link added'],['date','Effective date and due date checked'],['disclaimer','Disclaimer added ("general information, not advice")'],['na','Not applicable (general topic)']];
const SHOOT_ITEMS = [['script','Script read once'],['mic','Microphone checked'],['light','Light and background ready'],['outfit','Outfit ready'],['battery','Camera / phone charged'],['space','Storage space free']];
const PUB_ITEMS = [['title','Title written'],['description','Description written'],['hashtags','Hashtags added'],['thumbnail','Thumbnail ready'],['captions','Captions / subtitles added'],['cta','End screen / call to action added']];
const TEMPLATES = {

// ---------- API ----------
function guestToken() { try { return localStorage.getItem('studio_guest_token') || ''; } catch { return ''; } }
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  let res;
  if (mode === 'guest') {
    headers.Authorization = 'Bearer ' + guestToken();
    res = await fetch('/api/studio' + path, { ...opts, headers });
  } else {
    const scope = mode === 'admin' ? 'admin' : 'attendance';
    headers.Authorization = 'Bearer ' + GBSession.tokenFor(scope);
    res = await GBSession.fetch('/api/studio' + path, { ...opts, headers }, scope);
  }
  let data = {};
  try { data = await res.json(); } catch { /* empty */ }
  data.http = res.status;
  return data;
}
const msgBox = (text, ok) => `<div class="msg ${ok ? 'ok' : 'err'}">${esc(text)}</div>`;
const isAdmin = () => mode === 'admin';

// ---------- Boot ----------
async function boot() {
  if (guestToken()) mode = 'guest';
  else if (GBSession.tokenFor('admin') && GBSession.userFor('admin').is_admin) mode = 'admin';
  else if (GBSession.tokenFor('attendance')) mode = 'employee';
  if (!mode) return showLogin();
  const a = await api('/access');
  if (a.http === 401) { if (mode === 'guest') localStorage.removeItem('studio_guest_token'); return showLogin('Your session has ended. Please sign in again.'); }
  if (!a.success) return showNotice(a.message || 'Gee Bharat Studio is not available for you.');
  me = a;
  $('whoChip').style.display = ''; $('whoChip').textContent = `${a.name} · ${a.role || ''}`;
  $('logoutBtn').style.display = mode === 'guest' ? '' : 'none';
  $('backLink').style.display = mode === 'guest' ? 'none' : '';
  $('backLink').href = /office\.html/.test(document.referrer) ? '/office.html' : (mode === 'admin' ? '/admin.html' : '/dashboard.html');
  if (a.must_change_password) $('pwModal').classList.add('open');
  await loadAll();
  render();
}
function hideSide() { $('side').style.display = 'none'; $('side').classList.remove('show'); }
function showNotice(text) {

function showLogin(note) {

async function guestLogin() {

// ---------- Helpers ----------
const topicById = id => topics.find(t => t.id === id);
function parseTarget(label, fmt) {
  const m = String(label || '').match(/(\d+(?:\.\d+)?)\s*(sec|s|min|m)\b/i);
  if (m) return Math.round(parseFloat(m[1]) * (/^m/i.test(m[2]) ? 60 : 1));
  return FORMATS[fmt]?.target || null;
}
function speakSeconds(text) { const w = (String(text || '').match(/\S+/g) || []).length; return Math.round(w / 130 * 60); }
function fmtSec(sec) { const m = Math.floor(sec / 60), s = sec % 60; return m ? `${m} min ${s} sec` : `${s} sec`; }
function meterHtml(script, label, fmt, id) {
  const sec = speakSeconds(script);
  const target = parseTarget(label, fmt);
  const pct = target ? Math.min(100, Math.round(sec / target * 100)) : 0;
  const cls = !target ? '' : (sec > target * 1.1 ? 'over' : (sec > target * 0.9 ? 'near' : ''));
  const note = !target ? '' : (sec > target * 1.1 ? ` · ${fmtSec(sec - target)} over the ${fmtSec(target)} target` : ` · target ${fmtSec(target)}`);
  const shortWarn = fmt === 'Shorts' && sec > 90 ? ' · Shorts work best under 90 seconds' : '';
  return `<div class="meter ${cls}" ${id ? `id="${id}"` : ''}><span>&#9201; About ${fmtSec(sec)} when spoken${esc(note)}${shortWarn}</span><div class="bar"><i style="width:${pct}%"></i></div></div>`;
}
function reviewChip(t) {
  if (t.review_status === 'Pending') return '<span class="chip rv-p">Needs review</span>';
  if (t.review_status === 'Approved') return '<span class="chip rv-a">Approved</span>';
  if (t.review_status === 'Changes') return '<span class="chip rv-c">Changes asked</span>';
  return '';
}
const fmtChip = t => t.content_format ? `<span class="chip fmt">${esc(FORMATS[t.content_format]?.label || t.content_format)}</span>` : '';

// ---------- Calendar ----------
function calendarHtml() {
  const [y, m] = calMonth.split('-').map(Number);
  const first = new Date(y, m - 1, 1), days = new Date(y, m, 0).getDate(), lead = (first.getDay() + 6) % 7;
  const todayStr = new Date().toISOString().slice(0, 10);
  const title = first.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
  let cells = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => `<div class="dow">${d}</div>`).join('');
  for (let i = 0; i < lead; i++) cells += '<div class="day out"></div>';
  for (let d = 1; d <= days; d++) {
    const ds = `${calMonth}-${String(d).padStart(2, '0')}`;
    const evs = topics.filter(t => t.status !== 'Archived' && (t.shoot_date === ds || t.publish_date === ds));
    cells += `<div class="day ${ds === todayStr ? 'today' : ''}"><div class="d">${d}</div>${evs.map(t => `<button class="ev" style="--c:${STAGE_COLOR[t.status]}" title="${esc(t.title)}" onclick="openFromElsewhere(${t.id})">${t.shoot_date === ds ? '&#127916;' : '&#128640;'} ${esc(t.title)}</button>`).join('')}</div>`;
  }
  return `<div class="row" style="margin-bottom:8px"><div style="flex:1"><h2 class="page">Content Calendar</h2><div class="sub" style="margin:0">&#127916; shoot day · &#128640; publish day. Click a topic to open it.</div></div>
    <button class="btn alt sm" onclick="calMove(-1)">&larr;</button><b style="min-width:150px;text-align:center">${esc(title)}</b><button class="btn alt sm" onclick="calMove(1)">&rarr;</button><button class="btn sm" onclick="calToday()">Today</button></div>
    <div class="cal">${cells}</div>`;
}
function calMove(d) { const [y, m] = calMonth.split('-').map(Number); const n = new Date(y, m - 1 + d, 1); calMonth = `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}`; render(); }
function calToday() { calMonth = new Date().toISOString().slice(0, 7); render(); }

// ---------- Shoot day ----------
function kitKey(d) { return 'studio_kit_' + d; }
function shootHtml() {
  const all = topics.filter(t => t.status !== 'Archived' && t.status !== 'Published');
  if (!shootDate) {
    const todayStr = new Date().toISOString().slice(0, 10);
    const up = all.filter(t => t.shoot_date && t.shoot_date >= todayStr).map(t => t.shoot_date).sort()[0];
    shootDate = up || todayStr;
  }
  const day = all.filter(t => t.shoot_date === shootDate);
  const unscheduled = all.filter(t => !t.shoot_date && t.status === 'Ready to Shoot');
  let kit = {}; try { kit = JSON.parse(localStorage.getItem(kitKey(shootDate)) || '{}'); } catch { /* none */ }
  const withScript = day.filter(t => t.script || t.hook || t.key_points);
  return `<h2 class="page">Shoot Day</h2><div class="sub">Plan one day of shooting. Start the teleprompter and it runs through all the scripts, one after the other.</div>
    <div class="row" style="margin-bottom:14px"><label style="margin:0">Date</label><input type="date" value="${esc(shootDate)}" style="width:auto" onchange="shootDate=this.value;render()">
      <button class="btn vio" ${withScript.length ? '' : 'disabled style="opacity:.5"'} onclick="startQueue()">&#127909; Start teleprompter (${withScript.length} script${withScript.length === 1 ? '' : 's'})</button></div>
    <div class="grid2" style="gap:14px;align-items:start">
      <div class="card"><h3 style="margin-top:0">Topics for this day (${day.length})</h3>
        ${day.map(t => `<div class="child" onclick="openFromElsewhere(${t.id})"><span class="chip st" style="--c:${STAGE_COLOR[t.status]}">${esc(t.status)}</span><div style="flex:1"><b style="font-size:14px">${esc(t.title)}</b><div class="muted">${fmtChip(t) ? esc(FORMATS[t.content_format]?.label) + ' · ' : ''}${t.presenter_name ? esc(t.presenter_name) : 'No presenter'}${t.script ? ' · ' + esc(fmtSec(speakSeconds(t.script))) : ' · no script'}</div></div></div>`).join('') || '<div class="muted">Nothing is planned for this date. Set a shoot date on a topic with Edit.</div>'}
        ${isAdmin() && unscheduled.length ? `<h4 style="margin-bottom:6px">Ready to shoot, no date yet</h4>${unscheduled.map(t => `<div class="child"><div style="flex:1"><b style="font-size:14px">${esc(t.title)}</b></div><button class="btn sm" onclick="setShootDay(${t.id})">Add to this day</button></div>`).join('')}` : ''}</div>
      <div class="card"><h3 style="margin-top:0">Shoot kit for the day</h3><div class="cl" style="grid-template-columns:1fr">${SHOOT_ITEMS.slice(1).map(([k, l]) => `<label class="ck ${kit[k] ? 'done' : ''}"><input type="checkbox" ${kit[k] ? 'checked' : ''} onchange="toggleKit('${k}',this.checked)">${esc(l)}</label>`).join('')}</div>
        <div class="muted" style="margin-top:8px">Saved on this device only.</div></div></div>`;
}
function toggleKit(k, on) { let kit = {}; try { kit = JSON.parse(localStorage.getItem(kitKey(shootDate)) || '{}'); } catch {} kit[k] = on; try { localStorage.setItem(kitKey(shootDate), JSON.stringify(kit)); } catch {} render(); }
async function setShootDay(id) { const d = await api('/topics/' + id, { method: 'PUT', body: JSON.stringify({ shoot_date: shootDate }) }); if (!d.success) alert(d.message || 'Could not set the date.'); await loadAll(); render(); }
function startQueue() {
  const day = topics.filter(t => t.status !== 'Archived' && t.shoot_date === shootDate && (t.script || t.hook || t.key_points));
  if (!day.length) return;
  openTeleprompter(day[0].id, day);
}

// ---------- Teleprompter ----------
let tpList = [], tpIdx = 0, tpRun = false, tpSpd = 3, tpFont = 44, tpRaf = null, tpAcc = 0, tpCounting = false;
function openTeleprompter(id, list) {
  tpList = list || topics.filter(t => t.status !== 'Archived' && (t.script || t.hook || t.key_points));
  tpIdx = Math.max(0, tpList.findIndex(t => t.id === id));
  if (!tpList.length || !tpList.some(t => t.id === id)) { alert('This topic does not have a script yet.'); return; }
  $('tp').classList.add('open'); tpLoad();
}
function tpLoad() {
  const t = tpList[tpIdx];
  $('tpTitle').textContent = `${tpIdx + 1}/${tpList.length} · ${t.title}`;
  const parts = [];
  if (t.hook) parts.push(`<span class="tp-h">Opening line</span>${esc(t.hook)}`);
  if (t.script) parts.push(`<span class="tp-h">Script</span>${esc(t.script)}`);
  if (t.key_points) parts.push(`<span class="tp-h">Key points</span>${esc(t.key_points)}`);
  $('tpText').innerHTML = parts.join('<br>');
  $('tpText').style.fontSize = tpFont + 'px';
  $('tpScroll').scrollTop = 0; tpRun = false; tpAcc = 0; tpCounting = false; $('tpCount').style.display = 'none';
  $('tpPlay').textContent = '▶ Start'; $('tpSpeedLbl').textContent = 'Speed ' + tpSpd;
  cancelAnimationFrame(tpRaf);
}
function tpScrollLoop() {
  let last = performance.now();
  const step = now => { if (!tpRun) return; tpAcc += (now - last) / 1000 * tpSpd * 12; last = now; const whole = Math.floor(tpAcc); if (whole) { $('tpScroll').scrollTop += whole; tpAcc -= whole; } tpRaf = requestAnimationFrame(step); };
  tpRaf = requestAnimationFrame(step);
}
function tpToggle() {
  if (tpCounting) return;
  if (tpRun) { tpRun = false; $('tpPlay').textContent = '▶ Start'; return; }
  // 3-2-1 countdown, then roll
  tpCounting = true; let n = 3; const box = $('tpCount'); box.style.display = 'flex'; box.textContent = n;
  const iv = setInterval(() => {
    n--; if (n > 0) { box.textContent = n; return; }
    clearInterval(iv); box.style.display = 'none'; tpCounting = false; tpRun = true; $('tpPlay').textContent = '❚❚ Pause'; tpScrollLoop();
  }, 1000);
}
function tpSpeed(d) { tpSpd = Math.min(10, Math.max(1, tpSpd + d)); $('tpSpeedLbl').textContent = 'Speed ' + tpSpd; }
function tpSize(d) { tpFont = Math.min(120, Math.max(20, tpFont + d)); $('tpText').style.fontSize = tpFont + 'px'; }
function tpMirror() { $('tpText').classList.toggle('mirror'); }
function tpStep(d) { tpIdx = (tpIdx + d + tpList.length) % tpList.length; tpLoad(); }
function tpClose() { tpRun = false; tpCounting = false; $('tpCount').style.display = 'none'; cancelAnimationFrame(tpRaf); $('tp').classList.remove('open'); }
$('tpScroll').addEventListener('click', tpToggle);

boot();
</script>
</body>
</html>
