<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Admin Setup</title>
  <link rel="stylesheet" href="/assets/style.css" />
  <style>
    body { min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;padding:22px; }
    .card { width:100%;max-width:440px;background:#fff;border-radius:14px;box-shadow:0 16px 48px rgba(0,0,0,.22);padding:30px; }
    h1 { font-size:23px;color:#0f172a;margin-bottom:6px; }
    p { color:#64748b;font-size:14px;line-height:1.5;margin-bottom:20px; }
    #msg { margin-top:14px;display:none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Super Admin Setup</h1>
    <p>This setup works only before the first super admin is created.</p>
    <form id="setupForm">
      <div class="form-group">
        <label>Setup Token</label>
        <input id="token" required />
      </div>
      <div class="form-group">
        <label>Username</label>
        <input id="username" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label>Name</label>
        <input id="name" required />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input id="email_id" type="email" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input id="password" type="password" required autocomplete="new-password" />
      </div>
      <button class="btn-primary" id="btn" type="submit">Create Super Admin</button>
      <div id="msg" class="alert"></div>
    </form>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const tokenFromUrl = params.get('token') || '';
    document.getElementById('token').value = tokenFromUrl;

    function v(id) { return document.getElementById(id).value.trim(); }
    function show(text, ok) {
      const msg = document.getElementById('msg');
      msg.textContent = text;
      msg.className = 'alert ' + (ok ? 'alert-success' : 'alert-error');
      msg.style.display = 'block';
    }
    async function checkSetup() {
      if (!tokenFromUrl) return;
      const res = await fetch('/api/super-admin/setup-info?token=' + encodeURIComponent(tokenFromUrl));
      const data = await res.json();
      if (data.has_super_admin) show('Super admin is already configured.', false);
      else if (!data.setup_available) show('Setup token is not valid.', false);
    }
    document.getElementById('setupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      btn.disabled = true;
      btn.textContent = 'Creating...';
      try {
        const res = await fetch('/api/super-admin/setup', {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({
            token: v('token'),
            username: v('username'),
            name: v('name'),
            email_id: v('email_id'),
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        show(data.message || (data.success ? 'Created' : 'Setup failed'), !!data.success);
        if (data.success) setTimeout(() => location.href = '/super-admin.html', 700);
      } catch {
        show('Network error. Please try again.', false);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Super Admin';
      }
    });
    checkSetup();
  </script>
</body>
</html>
