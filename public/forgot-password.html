<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password</title>
  <link rel="stylesheet" href="/assets/style.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
      padding: 20px;
      color: #0f172a;
    }
    .reset-card {
      width: 100%;
      max-width: 460px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      padding: 34px 32px;
    }
    .reset-head { text-align: center; margin-bottom: 24px; }
    .reset-logo {
      width: 64px; height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      display: inline-flex; align-items: center; justify-content: center;
      color: white; font-size: 26px; margin-bottom: 12px;
    }
    .reset-head h1 { font-size: 23px; margin-bottom: 6px; }
    .reset-head p { font-size: 13px; color: #64748b; line-height: 1.5; }
    .stepper { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
    .step {
      padding: 9px 10px;
      border-radius: 10px;
      background: #f1f5f9;
      color: #64748b;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }
    .step.active { background: #dbeafe; color: #1d4ed8; }
    .channel-row { display:flex; gap:10px; margin-bottom: 18px; }
    .channel {
      flex: 1;
      border: 1.5px solid #e2e8f0;
      background: #f8fafc;
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }
    .channel.active { border-color:#2563eb; background:#eff6ff; color:#1d4ed8; }
    .channel.disabled { opacity:.45; cursor:not-allowed; }
    .actions { display:flex; gap:10px; align-items:center; margin-top: 18px; }
    .link { color:#64748b; text-decoration:none; font-size:13px; text-align:center; display:block; margin-top:18px; }
    .hint { font-size:12px; color:#64748b; margin-top:6px; line-height:1.45; }
    #msg { display:none; margin-bottom:14px; }
    #otpStep { display:none; }
  </style>
</head>
<body>
  <main class="reset-card">
    <div class="reset-head">
      <div class="reset-logo">&#128274;</div>
      <h1>Reset Password</h1>
      <p>Email OTP ya mobile OTP se password reset karein. Mobile OTP ke liye registered mobile number daliye.</p>
    </div>

    <div class="stepper">
      <div class="step active" id="step1">1. Verify Account</div>
      <div class="step" id="step2">2. Set Password</div>
    </div>

    <div id="msg" class="alert"></div>

    <section id="requestStep">
      <div class="form-group">
        <label>Login ID / Email / Mobile</label>
        <input id="loginId" autocomplete="username" placeholder="Employee ID, admin ID, email or mobile" />
        <div class="hint">Agar ye ID multiple offices me hai, OTP matching email par jayega.</div>
      </div>

      <div class="channel-row">
        <button type="button" class="channel active" id="emailChannel" onclick="setChannel('email')">Email OTP</button>
        <button type="button" class="channel" id="mobileChannel" onclick="setChannel('mobile')">Mobile OTP</button>
      </div>
      <div id="recaptcha-container"></div>

      <button class="btn-primary" id="sendBtn" onclick="sendOtp()">Send OTP</button>
    </section>

    <section id="otpStep">
      <div class="form-group">
        <label>OTP</label>
        <input id="otpCode" inputmode="numeric" placeholder="6 digit OTP" />
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input id="newPassword" type="password" autocomplete="new-password" placeholder="New password" />
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm password" />
      </div>
      <div class="actions">
        <button class="btn-primary" id="resetBtn" onclick="resetPassword()">Reset Password</button>
      </div>
      <button class="channel" style="width:100%;margin-top:10px" onclick="backToRequest()">Change Login ID</button>
    </section>

    <a class="link" id="backLink" href="/">Back to login</a>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const back = params.get('from') === 'office' ? '/office.html' : params.get('from') === 'admin' ? '/admin-login.html' : '/attendance.html';
    document.getElementById('backLink').href = back;
    let channel = 'email';
    let currentLogin = '';
    let firebaseReady = false;
    let confirmationResult = null;
    let recaptchaVerifier = null;

    function setChannel(next) {
      channel = next;
      document.getElementById('emailChannel').classList.toggle('active', next === 'email');
      document.getElementById('mobileChannel').classList.toggle('active', next === 'mobile');
      document.querySelector('#requestStep .hint').textContent = next === 'mobile'
        ? 'Mobile OTP ke liye registered 10 digit mobile number daliye.'
        : 'Agar ye ID multiple offices me hai, OTP matching email par jayega.';
    }

    function showMsg(text, ok) {
      const msg = document.getElementById('msg');
      msg.textContent = text;
      msg.className = 'alert ' + (ok ? 'alert-success' : 'alert-error');
      msg.style.display = 'block';
    }

    function friendlyOtpError(err) {
      const code = err?.code || '';
      const message = err?.message || '';
      if (code.includes('invalid-api-key')) return 'Firebase API key galat hai. Project settings ka Web API Key chahiye.';
      if (code.includes('unauthorized-domain')) return 'Firebase authorized domains me geebharat.com add nahi hai.';
      if (code.includes('billing-not-enabled')) return 'Firebase/Google billing enable nahi hai, real SMS OTP send nahi hoga.';
      if (code.includes('too-many-requests')) return 'Bahut jyada OTP request ho gayi. Thodi der baad try karein.';
      if (code.includes('invalid-phone-number')) return 'Mobile number valid format me nahi hai.';
      if (code.includes('captcha-check-failed')) return 'reCAPTCHA verify nahi hua. Page refresh karke try karein.';
      return message || 'OTP send failed. Please try again.';
    }

    function setStep(step) {
      document.getElementById('requestStep').style.display = step === 1 ? 'block' : 'none';
      document.getElementById('otpStep').style.display = step === 2 ? 'block' : 'none';
      document.getElementById('step1').classList.toggle('active', step === 1);
      document.getElementById('step2').classList.toggle('active', step === 2);
    }

    function normalizePhone(value) {
      const raw = value.trim();
      if (raw.startsWith('+')) return raw;
      const digits = raw.replace(/\D/g, '');
      if (digits.length === 10) return '+91' + digits;
      if (digits.length === 12 && digits.startsWith('91')) return '+' + digits;
      return '';
    }

    async function ensureFirebase() {
      if (firebaseReady) return;
      const res = await fetch('/api/auth/firebase-config');
      const data = await res.json();
      if (!data.success) throw new Error(data.message || 'Firebase OTP is not configured');
      firebase.initializeApp(data.config);
      recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
        size: 'invisible'
      });
      await recaptchaVerifier.render();
      firebaseReady = true;
    }

    async function sendOtp() {
      const btn = document.getElementById('sendBtn');
      currentLogin = document.getElementById('loginId').value.trim();
      if (!currentLogin) return showMsg('Login ID / Email / Mobile required', false);
      btn.disabled = true;
      btn.textContent = 'Sending...';
      try {
        if (channel === 'mobile') {
          const phone = normalizePhone(currentLogin);
          if (!phone) {
            showMsg('Mobile OTP ke liye valid 10 digit mobile number daliye.', false);
            return;
          }
          await ensureFirebase();
          confirmationResult = await firebase.auth().signInWithPhoneNumber(phone, recaptchaVerifier);
          showMsg('OTP mobile par send ho gaya.', true);
          setStep(2);
          document.getElementById('otpCode').focus();
          return;
        }
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login_id: currentLogin, channel })
        });
        const data = await res.json();
        showMsg(data.message || 'If account exists, OTP sent.', !!data.success);
        if (data.success) {
          setStep(2);
          document.getElementById('otpCode').focus();
        }
      } catch (err) {
        console.error('[forgot-password sendOtp]', err);
        showMsg(channel === 'mobile' ? friendlyOtpError(err) : 'Network error. Please try again.', false);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send OTP';
      }
    }

    async function resetPassword() {
      const code = document.getElementById('otpCode').value.trim();
      const pass = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      if (!code || !pass) return showMsg('OTP and new password required', false);
      if (pass !== confirm) return showMsg('Confirm password does not match', false);
      const btn = document.getElementById('resetBtn');
      btn.disabled = true;
      btn.textContent = 'Resetting...';
      try {
        let firebaseIdToken = null;
        if (channel === 'mobile') {
          if (!confirmationResult) return showMsg('Pehle mobile OTP send karein.', false);
          const credential = await confirmationResult.confirm(code);
          firebaseIdToken = await credential.user.getIdToken();
        }
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login_id: currentLogin, code, new_password: pass, channel, firebase_id_token: firebaseIdToken })
        });
        const data = await res.json();
        showMsg(data.message || 'Done', !!data.success);
        if (data.success) setTimeout(() => location.href = back, 900);
      } catch (err) {
        console.error('[forgot-password resetPassword]', err);
        showMsg(channel === 'mobile' ? friendlyOtpError(err) : 'Network error. Please try again.', false);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Reset Password';
      }
    }

    function backToRequest() {
      setStep(1);
    }
  </script>
</body>
</html>
