<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document Upload</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; background:#f1f5f9; margin:0; min-height:100vh; }
    .page { max-width: 640px; margin: 0 auto; padding: 32px 18px 60px; }
    .card { background:#fff; border-radius:14px; box-shadow:0 8px 32px rgba(15,23,42,.08); padding:24px; margin-bottom:16px; }
    h1 { font-size:20px; color:#0f172a; margin:0 0 4px; }
    p.sub { color:#64748b; font-size:13.5px; margin:0 0 20px; }
    .doc-row { border:1px solid #e2e8f0; border-radius:10px; padding:14px 16px; margin-bottom:12px; }
    .doc-name { font-weight:700; font-size:14.5px; color:#1e293b; }
    .badge { display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:800; margin-left:8px; }
    .b-pending { background:#fef3c7; color:#92400e; }
    .b-submitted { background:#dbeafe; color:#1e40af; }
    .b-approved { background:#dcfce7; color:#166534; }
    .remark { background:#fef2f2; border:1px solid #fecaca; color:#b91c1c; border-radius:8px; padding:8px 10px; font-size:12.5px; margin-top:8px; font-weight:600; }
    input[type=file] { margin-top:10px; font-size:13px; display:block; }
    button { background:#2563eb; color:#fff; border:0; border-radius:8px; padding:9px 16px; font-weight:700; font-size:13.5px; cursor:pointer; margin-top:10px; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .msg { margin-top:8px; font-size:12.5px; font-weight:700; }
    .msg.ok { color:#166534; }
    .msg.err { color:#b91c1c; }
    .empty { color:#94a3b8; text-align:center; padding:30px 0; }
    .filenote { font-size:12.5px; color:#64748b; margin-top:6px; }
  </style>
</head>
<body>
  <main class="page">
    <div class="card">
      <h1 id="partyName">Loading...</h1>
      <p class="sub" id="subText">Please upload the documents requested below. Accepted formats: PDF, JPG, PNG — max 5MB each.</p>
      <div id="docList"></div>
    </div>
  </main>

  <script>
    function h(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    const params = new URLSearchParams(window.location.search);
    const token = params.get('t');

    async function load() {
      if (!token) { document.getElementById('partyName').textContent = 'Invalid link'; document.getElementById('subText').textContent = ''; return; }
      try {
        const res = await fetch('/api/public/document-requests/' + encodeURIComponent(token));
        const data = await res.json();
        if (!data.success) {
          document.getElementById('partyName').textContent = 'Link not valid';
          document.getElementById('subText').textContent = data.message || 'This link is invalid or has expired.';
          return;
        }
        document.getElementById('partyName').textContent = data.party_name;
        const list = document.getElementById('docList');
        if (!data.requests.length) { list.innerHTML = '<div class="empty">No documents have been requested yet.</div>'; return; }
        list.innerHTML = data.requests.map(renderRow).join('');
      } catch {
        document.getElementById('partyName').textContent = 'Something went wrong';
        document.getElementById('subText').textContent = 'Please try reloading this page.';
      }
    }

    function renderRow(r) {
      const badge = r.status === 'Pending' ? '<span class="badge b-pending">Pending</span>'
        : r.status === 'Submitted' ? '<span class="badge b-submitted">Submitted — under review</span>'
        : '<span class="badge b-approved">Approved</span>';
      const remark = r.remark ? `<div class="remark">Please resubmit: ${h(r.remark)}</div>` : '';
      let body = '';
      if (r.status === 'Pending') {
        body = `
          <input type="file" id="file_${r.id}" accept="image/png,image/jpeg,image/webp,application/pdf"/>
          <button onclick="submitDoc(${r.id})" id="btn_${r.id}">Upload</button>
          <div class="msg" id="msg_${r.id}"></div>`;
      } else if (r.filename) {
        body = `<div class="filenote">File: ${h(r.filename)}</div>`;
      }
      return `<div class="doc-row" id="row_${r.id}">
        <div class="doc-name">${h(r.document_name)}${badge}</div>
        ${remark}
        ${body}
      </div>`;
    }

    async function submitDoc(id) {
      const fileInput = document.getElementById('file_' + id);
      const msg = document.getElementById('msg_' + id);
      const btn = document.getElementById('btn_' + id);
      msg.textContent = ''; msg.className = 'msg';
      if (!fileInput.files.length) { msg.textContent = 'Please choose a file first.'; msg.className = 'msg err'; return; }
      const file = fileInput.files[0];
      if (file.size > 5 * 1024 * 1024) { msg.textContent = 'File is too large (max 5MB).'; msg.className = 'msg err'; return; }
      btn.disabled = true; btn.textContent = 'Uploading...';
      try {
        const fd = new FormData();
        fd.append('file', file);
        const res = await fetch(`/api/public/document-requests/${encodeURIComponent(token)}/${id}/submit`, { method: 'POST', body: fd });
        const data = await res.json();
        if (!data.success) throw new Error(data.message || 'Upload failed');
        msg.textContent = 'Uploaded successfully!'; msg.className = 'msg ok';
        setTimeout(load, 1200);
      } catch (e) {
        msg.textContent = e.message || 'Upload failed'; msg.className = 'msg err';
        btn.disabled = false; btn.textContent = 'Upload';
      }
    }

    load();
  </script>
</body>
</html>
